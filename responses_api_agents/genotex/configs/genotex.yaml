genotex_agent:
  responses_api_agents:
    genotex:
      entrypoint: app.py
      domain: agent
      description: GenoTEX end-to-end GEO pilot using upstream stage metrics
      model_server:
        type: responses_api_models
        name: policy_model
      data_root: ${genotex_data_root}
      work_root: ${genotex_work_root}
      grader_python: ${genotex_grader_python}
      image: genotex-pilot:latest
      max_concurrent: 1
      max_steps: 80
      timeout_s: 7200
      cpus: 4
      memory_gb: 16
      datasets:
      - name: genotex
        type: benchmark
        jsonl_fpath: benchmarks/genotex/data/genotex_benchmark.jsonl
        prepare_script: benchmarks/genotex/prepare.py
        prompt_config: null
        num_repeats: 1
        license: CC-BY-4.0

genotex_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: genotex_agent
