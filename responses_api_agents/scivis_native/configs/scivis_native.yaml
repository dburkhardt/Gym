scivis_agent:
  responses_api_agents:
    scivis_native:
      entrypoint: app.py
      domain: agent
      source_root: ${scivis_source_root}
      task_manifest: ${scivis_task_manifest}
      native_config: ${scivis_native_config}
      output_root: ${scivis_output_root}
      endpoint: http://127.0.0.1:18883/v1
      max_tokens: 16384
      timeout_s: 7200
      inference_enabled: false
scivis_environment:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: scivis_agent
