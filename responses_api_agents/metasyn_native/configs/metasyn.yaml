metasyn_agent:
  responses_api_agents:
    metasyn_native:
      entrypoint: app.py
      domain: agent
      description: Native MetaSyn BM25 top200 RAG and complete creator evaluator, Super judge variant
      creator_source_root: ${oc.env:METASYN_CREATOR_SOURCE,/unqualified-metasyn-source}
      native_python: ${oc.env:METASYN_PYTHON}
      runner_script: ${oc.env:METASYN_RUNNER}
      materialized_root: ${oc.env:METASYN_DATA}
      output_root: ${oc.env:METASYN_OUTPUT}
      reference_file: ${oc.env:METASYN_REFERENCES}
      datasets:
      - name: metasyn
        type: benchmark
        jsonl_fpath: benchmarks/metasyn/data/benchmark.jsonl
        prepare_script: benchmarks/metasyn/prepare.py
        num_repeats: 1
metasyn_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: metasyn_agent
