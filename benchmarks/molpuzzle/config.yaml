molpuzzle_resources:
  resources_servers:
    campaign_creator_scoring:
      entrypoint: app.py
      domain: knowledge
      verified: false
      benchmark: molpuzzle
      upstream_repo: ${oc.env:CAMPAIGN_UPSTREAM_REPO}
      datasets:
      - name: molpuzzle
        type: benchmark
        jsonl_fpath: benchmarks/molpuzzle/data/benchmark.jsonl
        prepare_script: benchmarks/molpuzzle/prepare.py
        num_repeats: 1
molpuzzle_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      max_steps: 1
      resources_server:
        type: resources_servers
        name: molpuzzle_resources
      model_server:
        type: responses_api_models
        name: policy_model
molpuzzle_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: molpuzzle_agent
