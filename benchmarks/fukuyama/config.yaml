fukuyama_resources:
  resources_servers:
    campaign_creator_scoring:
      entrypoint: app.py
      domain: knowledge
      verified: false
      benchmark: fukuyama
      upstream_repo: ${oc.env:CAMPAIGN_UPSTREAM_REPO}
      datasets:
      - name: fukuyama
        type: benchmark
        jsonl_fpath: benchmarks/fukuyama/data/benchmark.jsonl
        prepare_script: benchmarks/fukuyama/prepare.py
        num_repeats: 1
fukuyama_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      max_steps: 1
      resources_server:
        type: resources_servers
        name: fukuyama_resources
      model_server:
        type: responses_api_models
        name: policy_model
fukuyama_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: fukuyama_agent
