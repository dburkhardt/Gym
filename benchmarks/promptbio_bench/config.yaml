provider_dispatch_guard: true
promptbio_agent:
  responses_api_agents:
    promptbio_bench:
      entrypoint: app.py
      domain: agent
      description: Containerized PromptBio tasks with pinned upstream artifact grading.
      model_server:
        type: responses_api_models
        name: policy_model
      model_name: nvidia/nvidia/nemotron-3.5-super-vl
      sandbox_image: ${oc.env:PROMPTBIO_SANDBOX_IMAGE,null}
      cache_dir: ${oc.env:PROMPTBIO_CACHE_DIR,null}
      output_dir: ${oc.env:PROMPTBIO_OUTPUT_DIR,null}
      scorer_dir: ${oc.env:PROMPTBIO_SCORER_DIR,null}
      scorer_image: ${oc.env:PROMPTBIO_SCORER_IMAGE,null}
      scorer_python: ${oc.env:PROMPTBIO_SCORER_PYTHON,python}
      comparison_models: []
      judge_model: nvidia/nvidia/nemotron-3.5-super-vl
      datasets:
      - name: promptbio_bench
        type: benchmark
        jsonl_fpath: benchmarks/promptbio_bench/data/promptbio_benchmark.jsonl
        prepare_script: benchmarks/promptbio_bench/prepare.py
        prepare_dependencies: [huggingface-hub==0.36.0]
        num_repeats: 1
        license: Apache-2.0
promptbio_environment:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: promptbio_agent
