# SPDX-License-Identifier: Apache-2.0
scienceqa_resources:
  resources_servers:
    campaign_creator_scoring:
      entrypoint: app.py
      domain: knowledge
      verified: false
      benchmark: scienceqa
      upstream_repo: ${oc.env:CAMPAIGN_UPSTREAM_REPO}
      datasets:
      - name: scienceqa
        type: benchmark
        jsonl_fpath: benchmarks/scienceqa/data/benchmark.jsonl
        prepare_script: benchmarks/scienceqa/prepare.py
        num_repeats: 1
scienceqa_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      max_steps: 1
      resources_server:
        type: resources_servers
        name: scienceqa_resources
      model_server:
        type: responses_api_models
        name: policy_model
scienceqa_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: scienceqa_agent
