s2tomg_resources:
  resources_servers:
    campaign_creator_scoring:
      entrypoint: app.py
      domain: knowledge
      verified: false
      benchmark: s2tomg
      upstream_repo: ${oc.env:CAMPAIGN_UPSTREAM_REPO}
      datasets:
      - name: s2tomg
        type: benchmark
        jsonl_fpath: benchmarks/s2tomg/data/benchmark.jsonl
        prepare_script: benchmarks/s2tomg/prepare.py
        num_repeats: 1
s2tomg_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      max_steps: 1
      resources_server:
        type: resources_servers
        name: s2tomg_resources
      model_server:
        type: responses_api_models
        name: policy_model
s2tomg_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: s2tomg_agent
