config_paths:
- resources_servers/ctbench/configs/ctbench.yaml
ctbench:
  resources_servers:
    ctbench:
      datasets:
      - name: ctbench
        type: benchmark
        required_model_roles:
          judge:
            component: ctbench
            binding_field: judge_model_server
            capabilities: [text_generation]
        jsonl_fpath: resources_servers/ctbench/data/benchmark.jsonl
        prepare_script: benchmarks/ctbench/prepare.py
        num_repeats: 1

# Judge identity is independent of policy_model and CLI --model overrides.
judge_model:
  responses_api_models:
    openai_model:
      entrypoint: app.py
      openai_base_url: ${judge_base_url}
      openai_api_key: ${judge_api_key}
      openai_model: ${oc.select:judge_model_name,nvidia/nvidia/nemotron-3.5-super-vl}
