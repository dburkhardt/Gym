# SPDX-License-Identifier: Apache-2.0
genomeqa_resources:
  resources_servers:
    campaign_creator_scoring:
      entrypoint: app.py
      domain: knowledge
      verified: false
      benchmark: genomeqa
      upstream_repo: ${oc.env:CAMPAIGN_UPSTREAM_REPO}
      datasets:
      - name: genomeqa
        type: benchmark
        jsonl_fpath: benchmarks/genomeqa/data/benchmark.jsonl
        prepare_script: benchmarks/genomeqa/prepare.py
        num_repeats: 1
genomeqa_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      max_steps: 1
      resources_server:
        type: resources_servers
        name: genomeqa_resources
      model_server:
        type: responses_api_models
        name: policy_model
genomeqa_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: genomeqa_agent
