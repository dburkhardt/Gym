# SPDX-License-Identifier: Apache-2.0
fgbench_resources:
  resources_servers:
    campaign_creator_scoring:
      entrypoint: app.py
      domain: knowledge
      verified: false
      benchmark: fgbench
      upstream_repo: ${oc.env:CAMPAIGN_UPSTREAM_REPO}
      datasets:
      - name: fgbench
        type: benchmark
        jsonl_fpath: benchmarks/fgbench/data/benchmark.jsonl
        prepare_script: benchmarks/fgbench/prepare.py
        num_repeats: 1
fgbench_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      max_steps: 1
      resources_server:
        type: resources_servers
        name: fgbench_resources
      model_server:
        type: responses_api_models
        name: policy_model
fgbench_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: fgbench_agent
