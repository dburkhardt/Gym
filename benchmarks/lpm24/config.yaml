lpm24_resources:
  resources_servers:
    campaign_creator_scoring:
      entrypoint: app.py
      domain: knowledge
      verified: false
      benchmark: lpm24
      upstream_repo: ${oc.env:CAMPAIGN_UPSTREAM_REPO}
      datasets:
      - name: lpm24
        type: benchmark
        jsonl_fpath: benchmarks/lpm24/data/benchmark.jsonl
        prepare_script: benchmarks/lpm24/prepare.py
        num_repeats: 1
lpm24_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      max_steps: 1
      resources_server:
        type: resources_servers
        name: lpm24_resources
      model_server:
        type: responses_api_models
        name: policy_model
lpm24_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: lpm24_agent
