harbor_agent:
  responses_api_agents:
    harbor_agent:
      entrypoint: app.py
      domain: agent
      description: NatureBench preserved creator Harbor tasks; native GPU and judge readiness required.
      concurrency: 1
      harbor_datasets:
        naturebench:
          local_dataset_path: benchmarks/naturebench/data/tasks
          workdir: /workspace
      harbor_agent_name: null
      harbor_agent_import_path: benchmarks.naturebench.timed_agent:NatureBenchTimedAgent
      harbor_agent_kwargs:
        inner_agent: responses_api_agents.harbor_agent.custom_agents.terminus_2_nemo_gym:Terminus2NemoGym
        timeout: 14400
        nemo_model_server_timeout_sec: 1200
        interleaved_thinking: true
        enable_summarize: false
        collect_rollout_details: true
        trajectory_config:
          raw_content: true
        model_info:
          max_input_tokens: 49152
          max_output_tokens: 16384
          input_cost_per_token: 0.0
          output_cost_per_token: 0.0
        parser_name: json
        responses_create_params:
          input: []
          temperature: 0.0
          max_output_tokens: 16384
      harbor_environment_type: docker
      harbor_environment_import_path: benchmarks.naturebench.docker_environment:NatureBenchDockerEnvironment
      harbor_environment_kwargs: {}
      harbor_no_delete: false
      harbor_measurement_review_import_path: benchmarks.naturebench.measurement_review:review
      harbor_verifier_import_path: benchmarks.naturebench.verifier:NatureBenchVerifier
      harbor_verifier_kwargs:
        bridge_host: ${oc.env:NATUREBENCH_BRIDGE_HOST,127.0.0.1}
      model_server:
        type: responses_api_models
        name: policy_model
      harbor_agent_override_timeout: null
      harbor_agent_max_timeout: null
      harbor_verifier_override_timeout: null
      harbor_verifier_max_timeout: null
      harbor_timeout_multiplier: null
      harbor_jobs_dir: responses_api_agents/harbor_agent/jobs
      datasets:
      - name: naturebench
        type: benchmark
        jsonl_fpath: benchmarks/naturebench/data/benchmark.jsonl
        prepare_script: benchmarks/naturebench/prepare.py
        num_repeats: 1
harbor_agent_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: harbor_agent
