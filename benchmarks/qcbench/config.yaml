# SPDX-License-Identifier: Apache-2.0
qcbench_resources:
  resources_servers:
    campaign_creator_scoring:
      entrypoint: app.py
      verified: false
      benchmark: qcbench
      upstream_repo: ${oc.env:CAMPAIGN_UPSTREAM_REPO}
      datasets:
      - name: qcbench
        type: benchmark
        jsonl_fpath: ${oc.env:CAMPAIGN_SAMPLE_JSONL}
        prepare_script: benchmarks/scientific_agent_campaign/use_sample.py
        num_repeats: 1
qcbench_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      max_steps: 1
      resources_server:
        type: resources_servers
        name: qcbench_resources
      model_server:
        type: responses_api_models
        name: policy_model
qcbench_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: qcbench_agent
