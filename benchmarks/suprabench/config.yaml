# SPDX-License-Identifier: Apache-2.0
suprabench_resources:
  resources_servers:
    campaign_creator_scoring:
      entrypoint: app.py
      domain: knowledge
      verified: false
      benchmark: suprabench
      upstream_repo: ${oc.env:CAMPAIGN_UPSTREAM_REPO}
      datasets:
      - name: suprabench
        type: benchmark
        jsonl_fpath: benchmarks/suprabench/data/benchmark.jsonl
        prepare_script: benchmarks/suprabench/prepare.py
        num_repeats: 1
suprabench_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      max_steps: 1
      resources_server:
        type: resources_servers
        name: suprabench_resources
      model_server:
        type: responses_api_models
        name: policy_model
suprabench_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: suprabench_agent
