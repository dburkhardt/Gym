# SPDX-License-Identifier: Apache-2.0
provider_dispatch_guard: true
harbor_agent:
  responses_api_agents:
    harbor_agent:
      entrypoint: app.py
      domain: agent
      description: Pinned AInstein creator four-tool agent and separate scientific scorer
      concurrency: 1
      harbor_datasets:
        ainsteinbench:
          local_dataset_path: benchmarks/ainsteinbench/data/tasks
      harbor_agent_name: null
      harbor_agent_import_path: benchmarks.ainsteinbench.harbor_native:AInsteinAgent
      harbor_agent_kwargs:
        source: ${oc.env:AINSTEIN_SOURCE}
      harbor_measurement_review_import_path: benchmarks.ainsteinbench.measurement_review:review
      harbor_verifier_import_path: benchmarks.ainsteinbench.harbor_native:AInsteinVerifier
      harbor_verifier_kwargs:
        source: ${oc.env:AINSTEIN_SOURCE}
      harbor_environment_type: docker
      harbor_environment_import_path: null
      harbor_environment_kwargs:
        extra_docker_compose:
        - responses_api_agents/harbor_agent/configs/egress-sidecar-limits.yaml
      harbor_required_artifact_sources: ["/submission"]
      harbor_no_delete: false
      harbor_jobs_dir: responses_api_agents/harbor_agent/jobs
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: ainsteinbench
        type: benchmark
        jsonl_fpath: benchmarks/ainsteinbench/data/benchmark.jsonl
        prepare_script: benchmarks/ainsteinbench/prepare.py
        num_repeats: 1
harbor_agent_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: harbor_agent
