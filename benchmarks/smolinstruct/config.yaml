# SPDX-License-Identifier: Apache-2.0
smolinstruct_resources:
  resources_servers:
    campaign_creator_scoring:
      entrypoint: app.py
      domain: knowledge
      verified: false
      benchmark: smolinstruct
      upstream_repo: ${oc.env:CAMPAIGN_UPSTREAM_REPO}
      datasets:
      - name: smolinstruct
        type: benchmark
        jsonl_fpath: benchmarks/smolinstruct/data/benchmark.jsonl
        prepare_script: benchmarks/smolinstruct/prepare.py
        num_repeats: 1
smolinstruct_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      max_steps: 1
      resources_server:
        type: resources_servers
        name: smolinstruct_resources
      model_server:
        type: responses_api_models
        name: policy_model
smolinstruct_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: smolinstruct_agent
