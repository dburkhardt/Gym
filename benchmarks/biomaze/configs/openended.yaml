config_paths:
- benchmarks/biomaze/config.yaml
biomaze:
  resources_servers:
    biomaze:
      judge_model_server:
        type: responses_api_models
        name: biomaze_judge
      judge_prompt_file: ${oc.env:BIOMAZE_JUDGE_PROMPT}
biomaze_judge:
  responses_api_models:
    openai_model:
      entrypoint: app.py
      openai_base_url: ${policy_base_url}
      openai_api_key: ${policy_api_key}
      openai_model: nvidia/nvidia/nemotron-3.5-super-vl
      upstream_max_num_tries: 1
      max_concurrent_requests: 1
