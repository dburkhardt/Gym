mollangbench_resources:
  resources_servers:
    campaign_creator_scoring:
      entrypoint: app.py
      domain: knowledge
      verified: false
      benchmark: mollangbench
      upstream_repo: ${oc.env:CAMPAIGN_UPSTREAM_REPO}
      datasets:
      - name: mollangbench
        type: benchmark
        jsonl_fpath: benchmarks/mollangbench/data/benchmark.jsonl
        prepare_script: benchmarks/mollangbench/prepare.py
        num_repeats: 1
mollangbench_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      max_steps: 1
      resources_server:
        type: resources_servers
        name: mollangbench_resources
      model_server:
        type: responses_api_models
        name: policy_model
mollangbench_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: mollangbench_agent
