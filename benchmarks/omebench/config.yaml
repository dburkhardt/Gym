# SPDX-License-Identifier: Apache-2.0
omebench_resources:
  resources_servers:
    campaign_creator_scoring:
      entrypoint: app.py
      domain: knowledge
      verified: false
      benchmark: omebench
      upstream_repo: ${oc.env:CAMPAIGN_UPSTREAM_REPO}
      datasets:
      - name: omebench
        type: benchmark
        jsonl_fpath: benchmarks/omebench/data/benchmark.jsonl
        prepare_script: benchmarks/omebench/prepare.py
        num_repeats: 1
omebench_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      max_steps: 1
      resources_server:
        type: resources_servers
        name: omebench_resources
      model_server:
        type: responses_api_models
        name: policy_model
omebench_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: omebench_agent
