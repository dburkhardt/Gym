# SPDX-License-Identifier: Apache-2.0
brainbench_resources:
  resources_servers:
    brainbench_likelihood:
      entrypoint: app.py
      domain: knowledge
      verified: false
      datasets:
      - name: brainbench
        type: benchmark
        required_model_capabilities: [conditional_loglikelihood]
        jsonl_fpath: benchmarks/brainbench/data/benchmark.jsonl
        prepare_script: benchmarks/brainbench/prepare.py
        num_repeats: 1
brainbench_agent:
  responses_api_agents:
    brainbench_likelihood:
      entrypoint: app.py
      output_root: ${oc.env:BRAINBENCH_OUTPUT_ROOT}
      resources_server:
        type: resources_servers
        name: brainbench_resources
      model_server:
        type: responses_api_models
        name: policy_model
brainbench_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: brainbench_agent
