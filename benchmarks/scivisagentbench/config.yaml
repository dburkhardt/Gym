# Historical runtime paths require qualification; inference remains closed.
scivis_agent:
  responses_api_agents:
    scivis_native:
      entrypoint: app.py
      domain: agent
      source_root: ${scivis_source_root}
      task_manifest: ${scivis_task_manifest}
      native_config: ${scivis_native_config}
      output_root: ${scivis_output_root}
      native_python: ${scivis_native_python}
      runtime_packet: ${scivis_runtime_packet}
      max_tokens: 16384
      timeout_s: 7200
      inference_enabled: false
      datasets:
        - name: scivisagentbench
          type: benchmark
          jsonl_fpath: benchmarks/scivisagentbench/data/benchmark.jsonl
          prepare_script: benchmarks/scivisagentbench/prepare.py
          num_repeats: 1
scivis_environment:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: scivis_agent
