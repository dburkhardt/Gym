reactbench:
  resources_servers:
    reactbench:
      entrypoint: app.py
      domain: knowledge
      verified: false
reactbench_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      max_steps: 1
      resources_server:
        type: resources_servers
        name: reactbench
      model_server:
        type: responses_api_models
        name: policy_model
reactbench_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: reactbench_simple_agent
