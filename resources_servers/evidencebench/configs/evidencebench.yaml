evidencebench:
  resources_servers:
    evidencebench:
      entrypoint: app.py
      domain: knowledge
      verified: false
evidencebench_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      max_steps: 1
      resources_server:
        type: resources_servers
        name: evidencebench
      model_server:
        type: responses_api_models
        name: policy_model
evidencebench_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: evidencebench_simple_agent
