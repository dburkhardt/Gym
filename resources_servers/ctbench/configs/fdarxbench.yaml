ctbench:
  resources_servers:
    ctbench:
      entrypoint: app.py
      domain: knowledge
      verified: false
ctbench_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      max_steps: 1
      resources_server:
        type: resources_servers
        name: ctbench
      model_server:
        type: responses_api_models
        name: policy_model
ctbench_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: ctbench_simple_agent
