proteinlmbench:
  resources_servers:
    proteinlmbench:
      entrypoint: app.py
      domain: knowledge
      verified: false
      description: ProteinLMBench protein knowledge multiple-choice evaluation
      value: Exact option-number accuracy on 944 public protein questions
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/proteinlmbench/data/example.jsonl
proteinlmbench_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      max_steps: 1
      resources_server:
        type: resources_servers
        name: proteinlmbench
      model_server:
        type: responses_api_models
        name: policy_model
proteinlmbench_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: proteinlmbench_simple_agent
