trialpanorama_screening:
  resources_servers:
    trialpanorama_screening:
      entrypoint: app.py
      creator_root: ${oc.env:TRIALPANORAMA_SOURCE}
      domain: knowledge
      verified: false
trialpanorama_screening_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      max_steps: 1
      resources_server:
        type: resources_servers
        name: trialpanorama_screening
      model_server:
        type: responses_api_models
        name: policy_model
trialpanorama_screening_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: trialpanorama_screening_simple_agent
